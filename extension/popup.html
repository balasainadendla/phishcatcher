<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishCatcher</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .container {
      background: white;
      margin: 0;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .header .icon {
      font-size: 28px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .content {
      padding: 20px;
    }
    
    .status {
      background: #f0f9ff;
      border: 2px solid #0ea5e9;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .status.safe {
      background: #f0fdf4;
      border-color: #22c55e;
    }
    
    .status.danger {
      background: #fef2f2;
      border-color: #ef4444;
    }
    
    .status-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }
    
    .status h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }
    
    .status p {
      font-size: 13px;
      color: #666;
    }
    
    .stats {
      background: #f8fafc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    
    .stats h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #475569;
    }
    
    .stat-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .stat-item:last-child {
      border-bottom: none;
    }
    
    .stat-label {
      font-size: 13px;
      color: #64748b;
    }
    
    .stat-value {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }
    
    .btn-secondary:hover {
      background: #f8fafc;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .last-check {
      background: #f8fafc;
      border-radius: 6px;
      padding: 12px;
      margin-top: 15px;
      font-size: 12px;
    }
    
    .last-check strong {
      display: block;
      margin-bottom: 5px;
      color: #475569;
    }
    
    .last-check-info {
      color: #64748b;
      line-height: 1.5;
    }
    
    .footer {
      padding: 15px 20px;
      background: #f8fafc;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
    }
    
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }
    
    .loading.active {
      display: block;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <span class="icon">🛡️</span>
        PhishCatcher
      </h1>
      <p>AI-Powered Phishing Protection</p>
    </div>
    
    <div class="content">
      <div id="status" class="status">
        <div class="status-icon">🔍</div>
        <h3>Checking current page...</h3>
        <p>Please wait while we analyze this website</p>
      </div>
      
      <div class="stats">
        <h3>📊 Protection Statistics</h3>
        <div class="stat-item">
          <span class="stat-label">Sites Checked</span>
          <span class="stat-value" id="totalChecks">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Threats Detected</span>
          <span class="stat-value" id="phishingDetected">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Sites Blocked</span>
          <span class="stat-value" id="sitesBlocked">0</span>
        </div>
      </div>
      
      <div class="actions">
        <button id="checkNow" class="btn btn-primary">
          🔍 Check This Page Now
        </button>
        <button id="viewSettings" class="btn btn-secondary">
          ⚙️ Settings
        </button>
      </div>
      
      <div id="lastCheck" class="last-check" style="display: none;">
        <strong>Last Check:</strong>
        <div class="last-check-info" id="lastCheckInfo">
          No recent checks
        </div>
      </div>
    </div>
    
    <div class="footer">
      PhishCatcher v1.0.0 | Backend: <span id="backendStatus">Checking...</span>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
